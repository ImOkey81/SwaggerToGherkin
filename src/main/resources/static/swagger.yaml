openapi: 3.0.3
info:
  title: SwaggerToGherkin API
  version: 1.1.0
  description: API for generating Gherkin scenarios and client tests from Swagger/OpenAPI files stored in GitHub.
servers:
  - url: http://localhost:8082
paths:
  /health:
    get:
      summary: Service health check
      operationId: health
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /supported-languages:
    get:
      summary: Get supported swagger-codegen languages
      operationId: supportedLanguages
      responses:
        '200':
          description: Supported target languages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportedLanguagesResponse'
  /generate-gherkin:
    post:
      summary: Generate Gherkin scenarios from OpenAPI file
      operationId: generateGherkin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubRequest'
      responses:
        '200':
          description: Generated Gherkin payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GherkinResponse'
        '400':
          description: Invalid input or processing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '415':
          description: Content-Type must be application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /generate-tests:
    post:
      summary: Generate API tests from OpenAPI file
      operationId: generateTests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubRequest'
      responses:
        '200':
          description: Tests generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestGenerationResponse'
        '400':
          description: Invalid input or processing error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '415':
          description: Content-Type must be application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /generated-tests/{generationId}/status:
    get:
      summary: Get generation status
      operationId: getGenerationStatus
      parameters:
        - name: generationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current generation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationStatusResponse'
        '404':
          description: Unknown generationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /generated-tests/{generationId}:
    get:
      summary: Download generated tests as zip archive
      operationId: downloadGeneratedTests
      parameters:
        - name: generationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Zip archive with generated tests
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Generation is not ready or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Unknown generationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /generated-tests/{generationId}/files:
    get:
      summary: List generated files
      operationId: listGeneratedFiles
      parameters:
        - name: generationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Generated file list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          description: Generation is not ready or failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Unknown generationId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
  /generated-tests/{generationId}/file:
    get:
      summary: Read or download a generated file
      operationId: getGeneratedFile
      parameters:
        - name: generationId
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
        - name: download
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: File content
          content:
            text/plain:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid path or generation is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: File or generation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
components:
  schemas:
    GitHubRequest:
      type: object
      required:
        - repoUrl
      properties:
        repoUrl:
          type: string
          description: GitHub raw URL, GitHub blob URL, or repository root URL.
          example: https://github.com/ImOkey81/ShadowPinger1/blob/main/openapi.yaml
        filePath:
          type: string
          nullable: true
          description: Path to OpenAPI file within repository. Required only when repoUrl points to repository root.
          example: openapi.yaml
        language:
          type: string
          description: Target language for generated tests. Required for POST /generate-tests.
          example: java
    GherkinResponse:
      type: object
      required:
        - status
        - gherkin
      properties:
        status:
          type: string
          example: success
        gherkin:
          type: string
          example: "Feature: CRUD scenarios for users"
    TestGenerationResponse:
      type: object
      required:
        - message
        - generationId
        - downloadPath
        - status
      properties:
        message:
          type: string
          example: Generation started
        generationId:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
        downloadPath:
          type: string
          example: /generated-tests/123e4567-e89b-12d3-a456-426614174000
        status:
          type: string
          example: PENDING
    GenerationStatusResponse:
      type: object
      required:
        - generationId
        - status
        - message
      properties:
        generationId:
          type: string
        status:
          type: string
          enum: [PENDING, DONE, ERROR]
        downloadPath:
          type: string
          nullable: true
        message:
          type: string
    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          example: UP
        service:
          type: string
          example: swagger-to-gherkin
    SupportedLanguagesResponse:
      type: object
      required:
        - languages
      properties:
        languages:
          type: array
          items:
            type: string
    ApiErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/ApiErrorDetails'
    ApiErrorDetails:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: INVALID_INPUT
        message:
          type: string
          example: Swagger file not found
